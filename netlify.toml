[build]
  command = "npm run build"
  publish = "dist"

# Stuur het oude Netlify-adres door naar het officiële domein. Deploy Previews hebben een ander adres en blijven werken.
[[redirects]]
  from = "https://ongoingmedia.netlify.app/*"
  to = "https://ongoingmedia.nl/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Bestanden in /_astro/ hebben een unieke naam per versie en mogen dus lang bewaard worden.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
