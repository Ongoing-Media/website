[build]
  command = "npm run build"
  publish = "dist"

# Stuur het oude Netlify-adres door naar het officiële domein. Deploy Previews hebben een ander adres en blijven werken.
[[redirects]]
  from = "https://ongoingmedia.netlify.app/*"
  to = "https://ongoingmedia.nl/:splat"
  status = 301
  force = true

# Het oude adres van "who we are" stuurt door naar het nieuwe (Netlify negeert de slash aan het eind).
[[redirects]]
  from = "/about"
  to = "/who-we-are/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
    # Alleen eigen code, het lettertype van Adobe Fonts mogen laden.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://use.typekit.net https://p.typekit.net; font-src 'self' https://use.typekit.net; img-src 'self' data: https://p.typekit.net; frame-src 'none'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

# Bestanden in /_astro/ hebben een unieke naam per versie en mogen dus lang bewaard worden.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
